# Secrets: Hanzo KMS (kms.hanzo.ai) — auth via Hanzo IAM
name: Publish and Update Formula

on:
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-n-publish-pypi:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build and tomlkit dependencies
        run: python -m pip install --upgrade pip build tomlkit

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Update version in pyproject.toml
        run: |
          python -c "
          import tomlkit
          with open('pyproject.toml', 'r') as f:
              content = tomlkit.load(f)
          content['project']['version'] = '${{ env.VERSION }}'
          with open('pyproject.toml', 'w') as f:
              tomlkit.dump(content, f)
          "

      - name: Build distribution
        run: python -m build --sdist --wheel --outdir dist/

      # - name: Publish distribution to TestPyPI for Validation
      #   uses: pypa/gh-action-pypi-publish@v1.8.14
      #   with:
      #     repository_url: https://test.pypi.org/legacy/

      # - name: Clear pip cache
      #   run: pip cache purge

      # - name: Install Comfy CLI from Test Pypi and Test
      #   run: |
      #     for i in {1..3}; do
      #       pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple hanzo-cli==${{env.VERSION}} && break || sleep 5
      #     done
      #     comfy --help

      - name: Publish distribution to Official PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  test-pip-installation:
    name: Test Comfy CLI Installation via pip
    needs: build-n-publish-pypi  # This job runs after build-n-publish completes successfully
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Comfy CLI via pip and Test
        run: pip install hanzo-cli==${{env.VERSION}}

      - name: Test Comfy CLI Help
        run: comfy --help

  publish-homebrew-tap:
    runs-on: macos-latest  # Use macOS runner where Homebrew is pre-installed
    needs: build-n-publish-pypi
    steps:
      - name: Fetch secrets from Hanzo KMS
        id: kms
        uses: hanzoui/.github/actions/kms-secrets@main
        with:
          kms_client_id: ${{ secrets.KMS_CLIENT_ID }}
          kms_client_secret: ${{ secrets.KMS_CLIENT_SECRET }}
          secrets: 'COMMITTER_TOKEN'
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: 'hanzoui/homebrew-cli'
          token: ${{ steps.kms.outputs.COMMITTER_TOKEN }}
          path: 'homebrew-repo'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install homebrew-pypi-poet

          for i in {1..3}; do
            pip install hanzo-cli==${{env.VERSION}} && break || sleep 5
          done

      - name: Generate Homebrew Formula
        run: |
          source venv/bin/activate
          poet -f hanzo-cli==$VERSION > hanzo-cli.rb

      - name: Move Formulas to Tap Directory
        run: |
          mv hanzo-cli.rb homebrew-repo/Formula/

      - name: Install Comfy CLI using Homebrew Formula
        run: |
          brew install --build-from-source --verbose ./homebrew-repo/Formula/hanzo-cli.rb
          comfy --help
          brew uninstall hanzo-cli

      - name: Commit and Push Formula
        run: |
          cd homebrew-repo
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/hanzo-cli.rb
          git commit -m "Update hanzo-cli to latest and version ${VERSION}"
          git push
        env:
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GITHUB_TOKEN: ${{ steps.kms.outputs.COMMITTER_TOKEN }}


  test-homebrew-installation:
    name: Test Comfy CLI Installation via Homebrew
    needs: publish-homebrew-tap  # This job runs after publish-homebrew-tap completes successfully
    runs-on: macos-latest
    steps:
      - name: Tap Comfy CLI Homebrew tap repository
        run: brew tap hanzoui/cli

      - name: Install hanzo-cli latest via Homebrew
        run: brew install hanzoui/hanzo-cli/hanzo-cli

      - name: Test hanzo-cli latest Help
        run: comfy --help

      - name: Uninstall hanzo-cli latest
        run: brew uninstall hanzo-cli
